<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<title>ශබ්දකෝෂ සෙවුම</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Sinhala&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#F5F1E6; --surface:#FFFFFF; --surface-soft:#FBF8EF;
    --ink:#202B1D; --muted:#707963; --line:#E4DEC9;
    --pine:#1E3B24; --pine-light:#33553B; --pine-soft:#E9EEE3;
    --gold:#B9812C; --gold-soft:#F2E2BB; --danger:#A53A3A;
    --xref:#1E7B3A; --xref-bg:#E7F3EA;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; flex-direction:column;
    font-family:'Noto Sans Sinhala','Segoe UI',Tahoma,sans-serif; line-height:1.6;
  }
  h1,h2,h3{ font-family:'Tiro Sinhala','Noto Serif Sinhala',Georgia,serif; font-weight:400; margin:0; }
  button{ font-family:inherit; cursor:pointer; }

  .topbar{ background:var(--pine); color:#F4F1E4; padding:20px 20px 22px; text-align:center; }
  .topbar h1{ font-size:clamp(22px,3vw,28px); }
  .topbar p{ margin:4px 0 0; color:#B9C6B2; font-size:13px; }

  .main{ flex:1; width:100%; max-width:720px; margin:0 auto; padding:22px 16px 40px; }

  .langs{ display:flex; gap:8px; justify-content:center; margin-bottom:16px; }
  .lang-btn{
    padding:9px 22px; border-radius:999px; border:1.5px solid var(--pine); background:var(--surface);
    color:var(--pine); font-size:15px; font-weight:600;
  }
  .lang-btn.active{ background:var(--pine); color:#F4F1E4; }

  .search-wrap{ position:relative; }
  .search{ position:relative; }
  .search input{
    width:100%; padding:14px 16px 14px 42px; border-radius:11px;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
    font-size:17px; font-family:inherit;
  }
  .search input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .search svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--muted); pointer-events:none; }

  .suggest{
    position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20;
    background:var(--surface); border:1px solid var(--line); border-radius:11px;
    box-shadow:0 14px 34px rgba(20,35,20,.18); max-height:320px; overflow:auto; display:none;
  }
  .suggest.open{ display:block; }
  .suggest button{
    display:block; width:100%; text-align:left; padding:11px 16px; border:none; background:none;
    font-size:16px; color:var(--ink); border-bottom:1px solid var(--line);
  }
  .suggest button:last-child{ border-bottom:none; }
  .suggest button:hover, .suggest button.hi{ background:var(--pine-soft); }
  .suggest .none{ padding:14px 16px; color:var(--muted); font-size:14px; }

  .result{ margin-top:22px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--pine);
    border-radius:13px; padding:20px; display:flex; flex-direction:column; gap:14px;
  }
  .card h2{ font-size:28px; color:var(--pine); overflow-wrap:anywhere; }
  .lbl{ font-size:11.5px; letter-spacing:.3px; color:var(--muted); font-weight:600; margin-bottom:4px; }
  .meaning{ font-size:16px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .note{
    background:var(--gold-soft); border-left:3px solid var(--gold); border-radius:6px;
    padding:9px 12px; font-size:14.5px; color:#4A3410; white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .note .lbl{ color:#7A5A22; }
  .examples{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
  .examples li{
    font-size:14.5px; color:#39432F; padding:8px 11px; background:var(--surface-soft);
    border:1px solid var(--line); border-radius:9px; overflow-wrap:anywhere;
  }
  .empty-hint, .no-hit{
    text-align:center; color:var(--muted); padding:36px 12px; border:1px dashed var(--line);
    border-radius:13px; background:var(--surface-soft); margin-top:22px; font-size:14.5px;
  }

  .xref{ color:var(--xref); background:var(--xref-bg); border-radius:4px; padding:0 2px; cursor:pointer; font-weight:600; }

  .xpop{
    position:fixed; z-index:90; max-width:min(320px,88vw); background:var(--pine); color:#F4F1E4;
    border-radius:10px; padding:11px 13px; font-size:13.5px; box-shadow:0 14px 34px rgba(20,35,20,.35);
    display:none; line-height:1.5;
  }
  .xpop.show{ display:block; }
  .xpop b{ display:block; margin-bottom:3px; font-family:'Tiro Sinhala','Noto Serif Sinhala',Georgia,serif; font-size:15px; }

  .login{
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login.hidden{ display:none; }
  .login-card{
    width:min(380px, 100%); background:var(--surface); border:1px solid var(--line);
    border-top:5px solid var(--pine); border-radius:14px; padding:26px 24px;
    display:flex; flex-direction:column; gap:12px;
  }
  .login-card h1{ font-size:22px; color:var(--pine); }
  .login-card p{ margin:0 0 4px; color:var(--muted); font-size:13.5px; }
  .login-card input{
    padding:12px; border:1px solid var(--line); border-radius:8px; font-family:inherit;
    font-size:15px; background:var(--surface-soft);
  }
  .login-card input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .login-msg{ min-height:18px; font-size:13px; color:var(--danger); }
  .btn{
    border:1px solid var(--pine); background:var(--pine); color:#F4F1E4;
    padding:11px 16px; border-radius:9px; font-size:14.5px; font-weight:500;
  }
  .btn:hover{ background:var(--pine-light); }
  .btn:disabled{ opacity:.6; cursor:default; }

  footer{ text-align:center; color:var(--muted); font-size:12.5px; padding:18px 10px 26px; }

  @media (max-width:480px){
    .main{ padding:16px 12px 34px; }
    .card{ padding:16px; }
  }
</style>
</head>
<body>

<div class="login" id="login">
  <form class="login-card" id="loginForm">
    <h1>ශබ්දකෝෂ සෙවුම</h1>
    <p>බැලීමට Login වන්න</p>
    <input id="lEmail" type="email" required autocomplete="username" placeholder="Email">
    <input id="lPass" type="password" required autocomplete="current-password" placeholder="Password">
    <div class="login-msg" id="loginMsg"></div>
    <button class="btn" type="submit" id="loginBtn">Login</button>
  </form>
</div>

<div class="app" id="app" style="display:none">
  <header class="topbar">
    <h1>ශබ්දකෝෂ සෙවුම</h1>
    <p>වචනයක් සොයා අර්ථය බලන්න</p>
  </header>

  <div class="main">
    <div class="langs">
      <button class="lang-btn active" id="langSi" type="button">සිංහල</button>
      <button class="lang-btn" id="langEn" type="button">English</button>
    </div>

    <div class="search-wrap">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="text" autocomplete="off" placeholder="වචනයක් සොයන්න...">
      </div>
      <div class="suggest" id="suggest"></div>
    </div>

    <div id="result"></div>
  </div>

  <footer>Copyrights - Amila Udawattha 2026</footer>
</div>

<div class="xpop" id="xpop"></div>

<script>
/* ===== Supabase project (same one used by the editable dictionaries; this page only reads) ===== */
const SUPABASE_URL      = 'https://jcijglwpkfluyzrltimk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs';

const $ = id => document.getElementById(id);
let sb = null, session = null;
let lang = 'si';                 // 'si' or 'en'
let dict = { si: [], en: [] };   // {word, meaning, examples[], note}
let dictMap = { si: new Map(), en: new Map() };
let activeIdx = -1;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
function norm(s){
  return String(s || '').normalize('NFC').replace(/[\u200c\u200d]/g,'').toLowerCase()
    .replace(/[^\p{L}\p{M}\p{N}]+/gu,' ').trim();
}
function letterCount(s){ return String(s || '').replace(/[\p{M}\u200c\u200d]/gu,'').length; }

/* ---------- load both dictionaries (read-only) ---------- */
async function fetchTable(table, noteCol){
  const all = [], size = 1000;
  for(let from = 0; ; from += size){
    const { data, error } = await sb.from(table).select('*')
      .order('word', {ascending:true}).range(from, from + size - 1);
    if(error) throw error;
    all.push(...data);
    if(data.length < size) break;
  }
  return all.map(r => ({
    word: r.word, meaning: r.meaning,
    examples: r.examples || [],
    note: r[noteCol] || ''
  }));
}
let maxWords = { si:1, en:1 };
function computeMaxWords(map){
  let max = 1;
  map.forEach((_, k)=>{ const n = k.split(' ').length; if(n > max) max = n; });
  return max;
}
async function loadAll(){
  const [si, en] = await Promise.all([
    fetchTable('sinhala_dictionary', 'note'),
    fetchTable('vocabulary', 'sinhala')
  ]);
  dict.si = si; dict.en = en;
  dictMap.si = new Map(si.map(e => [norm(e.word), e]));
  dictMap.en = new Map(en.map(e => [norm(e.word), e]));
  maxWords.si = computeMaxWords(dictMap.si);
  maxWords.en = computeMaxWords(dictMap.en);
}

/* ---------- suggestions (word field only) ---------- */
function currentList(){ return dict[lang]; }
function suggestionsFor(term){
  const t = norm(term);
  if(!t) return [];
  const starts = [], contains = [];
  currentList().forEach(e=>{
    const w = norm(e.word);
    if(w.startsWith(t)) starts.push(e);
    else if(w.includes(t)) contains.push(e);
  });
  const cmp = (a,b)=> a.word.localeCompare(b.word, 'en');
  return starts.sort(cmp).concat(contains.sort(cmp)).slice(0, 30);
}

const sugBox = $('suggest'), q = $('q');
function closeSuggest(){ sugBox.classList.remove('open'); sugBox.innerHTML = ''; activeIdx = -1; }
function renderSuggest(list){
  sugBox.innerHTML = '';
  if(!list.length){
    sugBox.appendChild(el('div','none','ගැළපෙන වචනයක් හමු නොවීය.'));
  }else{
    list.forEach(e=>{
      const b = el('button', '', e.word);
      b.type = 'button';
      b.onclick = ()=>{ q.value = e.word; closeSuggest(); showEntry(e); };
      sugBox.appendChild(b);
    });
  }
  sugBox.classList.add('open');
}
q.addEventListener('input', ()=>{
  const term = q.value.trim();
  if(letterCount(term) < 2){ closeSuggest(); return; }
  renderSuggest(suggestionsFor(term));
});
q.addEventListener('keydown', ev=>{
  const items = Array.from(sugBox.querySelectorAll('button'));
  if(!items.length) return;
  if(ev.key === 'ArrowDown'){ ev.preventDefault(); activeIdx = Math.min(activeIdx+1, items.length-1); }
  else if(ev.key === 'ArrowUp'){ ev.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); }
  else if(ev.key === 'Enter'){ ev.preventDefault(); (items[activeIdx] || items[0]).click(); return; }
  else return;
  items.forEach((b,i)=>b.classList.toggle('hi', i===activeIdx));
  if(items[activeIdx]) items[activeIdx].scrollIntoView({block:'nearest'});
});
document.addEventListener('click', ev=>{
  if(!ev.target.closest('.search-wrap')) closeSuggest();
});

/* ---------- language switch ---------- */
function setLang(l){
  lang = l;
  $('langSi').classList.toggle('active', l === 'si');
  $('langEn').classList.toggle('active', l === 'en');
  q.value = '';
  q.placeholder = l === 'si' ? 'වචනයක් සොයන්න...' : 'Search a word...';
  closeSuggest();
  $('result').innerHTML = '';
  q.focus();
}
$('langSi').onclick = ()=>setLang('si');
$('langEn').onclick = ()=>setLang('en');

/* ---------- cross-reference: highlight dictionary words inside meaning/examples ---------- */
const WORD_RE = /[\p{L}\p{M}]+/gu;
function xrefFragment(text, selfNorm){
  const frag = document.createDocumentFragment();
  const map = dictMap[lang];
  const limit = maxWords[lang] || 1;

  // collect every word token with its position in the text
  const tokens = [];
  WORD_RE.lastIndex = 0;
  let m;
  while((m = WORD_RE.exec(text))) tokens.push({ text:m[0], start:m.index, end:m.index + m[0].length });

  let last = 0, i = 0;
  while(i < tokens.length){
    let matched = false;
    // try the longest possible phrase first (so a 2-word entry wins over its first word alone)
    for(let L = Math.min(limit, tokens.length - i); L >= 1; L--){
      const span = tokens.slice(i, i + L);
      const key = span.map(t => norm(t.text)).join(' ');
      if(!key || key === selfNorm) continue;
      const hit = map.get(key);
      if(hit){
        const start = span[0].start, end = span[span.length - 1].end;
        if(last < start) frag.appendChild(document.createTextNode(text.slice(last, start)));
        const sp = el('span','xref', text.slice(start, end));
        bindXref(sp, hit);
        frag.appendChild(sp);
        last = end;
        i += L;
        matched = true;
        break;
      }
    }
    if(!matched) i++;
  }
  if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

const xpop = $('xpop');
const isTouch = matchMedia('(hover: none)').matches;
function positionPop(target){
  const r = target.getBoundingClientRect();
  const pw = xpop.offsetWidth || 260;
  let left = r.left; if(left + pw > innerWidth - 10) left = innerWidth - pw - 10;
  if(left < 10) left = 10;
  let top = r.bottom + 8;
  if(top + xpop.offsetHeight > innerHeight - 10) top = r.top - xpop.offsetHeight - 8;
  xpop.style.left = left + 'px'; xpop.style.top = top + 'px';
}
function showPop(target, entry){
  xpop.innerHTML = '';
  xpop.appendChild(el('b','',entry.word));
  xpop.appendChild(el('span','',entry.meaning));
  xpop.classList.add('show');
  positionPop(target);
}
function hidePop(){ xpop.classList.remove('show'); }
function bindXref(span, entry){
  if(isTouch){
    span.addEventListener('click', ev=>{
      ev.stopPropagation();
      const open = xpop.classList.contains('show') && xpop._for === span;
      hidePop();
      if(!open){ xpop._for = span; showPop(span, entry); }
    });
  }else{
    span.addEventListener('mouseenter', ()=>{ xpop._for = span; showPop(span, entry); });
    span.addEventListener('mouseleave', hidePop);
  }
}
document.addEventListener('click', ev=>{
  if(isTouch && !ev.target.closest('.xref')) hidePop();
});

/* ---------- show a full entry ---------- */
function showEntry(e){
  const box = $('result'); box.innerHTML = '';
  const c = el('article','card');
  c.appendChild(el('h2','',e.word));
  const selfNorm = norm(e.word);

  const m = el('div');
  m.appendChild(el('div','lbl','අර්ථය'));
  const mDiv = el('div','meaning'); mDiv.appendChild(xrefFragment(e.meaning, selfNorm));
  m.appendChild(mDiv);
  c.appendChild(m);

  if(e.note){
    const n = el('div','note');
    n.appendChild(el('div','lbl', lang === 'si' ? 'පර්යාය පද / සටහන' : 'සිංහලෙන්'));
    const nd = document.createElement('div'); nd.appendChild(xrefFragment(e.note, selfNorm));
    n.appendChild(nd);
    c.appendChild(n);
  }
  if(e.examples && e.examples.length){
    const x = el('div');
    x.appendChild(el('div','lbl','උදාහරණ'));
    const ul = el('ul','examples');
    e.examples.forEach(t=>{
      const li = document.createElement('li');
      li.appendChild(xrefFragment(t, selfNorm));
      ul.appendChild(li);
    });
    x.appendChild(ul);
    c.appendChild(x);
  }
  box.appendChild(c);
}

/* ---------- login ---------- */
function showLogin(msg){ $('login').classList.remove('hidden'); $('app').style.display = 'none'; $('loginMsg').textContent = msg || ''; }
async function afterLogin(){
  $('login').classList.add('hidden');
  $('app').style.display = '';
  $('result').innerHTML = '<div class="empty-hint">දත්ත load වෙමින්...</div>';
  try{
    await loadAll();
    $('result').innerHTML = '';
  }catch(err){
    $('result').innerHTML = '';
    $('result').appendChild(el('div','no-hit','දත්ත ගැනීමට නොහැකි විය: ' + (err.message || err)));
  }
  q.focus();
}
$('loginForm').addEventListener('submit', async ev=>{
  ev.preventDefault();
  if(!sb){ showLogin('Supabase library එක load වී නැත. Internet connection එක බලා page එක refresh කරන්න.'); return; }
  const btn = $('loginBtn'); btn.disabled = true; $('loginMsg').textContent = '';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email:$('lEmail').value.trim(), password:$('lPass').value });
    if(error){ $('loginMsg').textContent = error.message; return; }
    session = data.session; $('lPass').value = '';
    await afterLogin();
  }catch(err){ $('loginMsg').textContent = err.message || String(err); }
  finally{ btn.disabled = false; }
});

async function init(){
  if(!window.supabase){ showLogin('Supabase library එක load වී නැත. Internet connection එක බලා page එක refresh කරන්න.'); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, s)=>{
    session = s;
    if(event === 'SIGNED_OUT'){ dict = {si:[],en:[]}; dictMap = {si:new Map(),en:new Map()}; showLogin(''); }
  });
  const { data } = await sb.auth.getSession();
  session = data.session;
  if(session) await afterLogin();
  else showLogin('');
}
init();
</script>
</body>
</html>
